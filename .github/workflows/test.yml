name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.10.4

      - name: Run tests
        run: nvim --headless -c "set rtp+=." -c "luafile tests/browser_opening_test.lua" -c "qa!"
